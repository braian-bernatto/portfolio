<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Banking platform dashboard mockup (placeholder)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1218"/>
      <stop offset="1" stop-color="#090b0f"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="donut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.6" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b3b4a"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect width="800" height="520" rx="18" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="798.5" height="518.5" rx="17.25" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- top bar -->
  <rect x="22" y="20" width="756" height="46" rx="12" fill="#141821"/>
  <circle cx="44" cy="43" r="5" fill="#f87171"/>
  <circle cx="62" cy="43" r="5" fill="#fbbf24"/>
  <circle cx="80" cy="43" r="5" fill="#34d399"/>
  <rect x="300" y="34" width="200" height="18" rx="9" fill="#1c2029"/>
  <rect x="700" y="32" width="60" height="22" rx="11" fill="url(#brand)" opacity="0.85"/>
  <text x="730" y="47" font-family="JetBrains Mono,monospace" font-size="11" font-weight="600" fill="#06070a" text-anchor="middle">+ New</text>

  <!-- sidebar -->
  <rect x="22" y="78" width="120" height="420" rx="12" fill="#101319"/>
  <rect x="38" y="96" width="84" height="14" rx="7" fill="#1c2029"/>
  <g font-family="JetBrains Mono,monospace" font-size="11" fill="#6b7280">
    <rect x="38" y="128" width="88" height="26" rx="8" fill="#2dd4bf" fill-opacity="0.1"/>
    <text x="52" y="145" fill="#5eead4">Dashboard</text>
    <text x="52" y="177">Accounts</text>
    <text x="52" y="207">Transfers</text>
    <text x="52" y="237">Cards</text>
    <text x="52" y="267">Reports</text>
    <text x="52" y="297">Settings</text>
  </g>

  <!-- KPI tiles -->
  <g>
    <rect x="158" y="78" width="190" height="96" rx="12" fill="#141821"/>
    <text x="176" y="108" font-family="JetBrains Mono,monospace" font-size="11" fill="#6b7280">TOTAL BALANCE</text>
    <text x="176" y="142" font-family="Bricolage Grotesque,sans-serif" font-size="30" font-weight="800" fill="#e8eaf0">$4,820,930</text>
    <text x="176" y="160" font-family="JetBrains Mono,monospace" font-size="11" fill="#34d399">▲ 12.4%</text>

    <rect x="358" y="78" width="190" height="96" rx="12" fill="#141821"/>
    <text x="376" y="108" font-family="JetBrains Mono,monospace" font-size="11" fill="#6b7280">INFLOW</text>
    <text x="376" y="142" font-family="Bricolage Grotesque,sans-serif" font-size="30" font-weight="800" fill="#e8eaf0">$1,204,800</text>
    <text x="376" y="160" font-family="JetBrains Mono,monospace" font-size="11" fill="#34d399">▲ 8.1%</text>

    <rect x="558" y="78" width="220" height="96" rx="12" fill="#141821"/>
    <text x="576" y="108" font-family="JetBrains Mono,monospace" font-size="11" fill="#6b7280">OUTFLOW</text>
    <text x="576" y="142" font-family="Bricolage Grotesque,sans-serif" font-size="30" font-weight="800" fill="#e8eaf0">$742,310</text>
    <text x="576" y="160" font-family="JetBrains Mono,monospace" font-size="11" fill="#f87171">▼ 3.2%</text>
  </g>

  <!-- chart card -->
  <rect x="158" y="186" width="332" height="208" rx="12" fill="#141821"/>
  <text x="178" y="214" font-family="JetBrains Mono,monospace" font-size="11" fill="#6b7280">CASH FLOW · 12M</text>
  <!-- gridlines -->
  <g stroke="#1c2029" stroke-width="1">
    <line x1="178" y1="260" x2="470" y2="260"/>
    <line x1="178" y1="300" x2="470" y2="300"/>
    <line x1="178" y1="340" x2="470" y2="340"/>
  </g>
  <!-- area + line -->
  <path d="M178,330 L206,300 L234,316 L262,270 L290,288 L318,240 L346,262 L374,224 L402,250 L430,212 L458,232 L470,228 L470,360 L178,360 Z" fill="url(#area)"/>
  <path d="M178,330 L206,300 L234,316 L262,270 L290,288 L318,240 L346,262 L374,224 L402,250 L430,212 L458,232 L470,228" fill="none" stroke="url(#brand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bars -->
  <g fill="#2dd4bf" fill-opacity="0.5">
    <rect x="186" y="338" width="10" height="22" rx="3"/>
    <rect x="214" y="320" width="10" height="40" rx="3"/>
    <rect x="242" y="330" width="10" height="30" rx="3"/>
    <rect x="270" y="300" width="10" height="60" rx="3"/>
    <rect x="298" y="314" width="10" height="46" rx="3"/>
    <rect x="326" y="280" width="10" height="80" rx="3"/>
    <rect x="354" y="296" width="10" height="64" rx="3"/>
    <rect x="382" y="268" width="10" height="92" rx="3"/>
    <rect x="410" y="286" width="10" height="74" rx="3"/>
    <rect x="438" y="260" width="10" height="100" rx="3"/>
  </g>

  <!-- donut card -->
  <rect x="498" y="186" width="280" height="208" rx="12" fill="#141821"/>
  <text x="518" y="214" font-family="JetBrains Mono,monospace" font-size="11" fill="#6b7280">ALLOCATION</text>
  <g transform="translate(638,298)">
    <circle r="56" fill="none" stroke="#1c2029" stroke-width="20"/>
    <circle r="56" fill="none" stroke="url(#donut)" stroke-width="20" stroke-dasharray="220 352" stroke-dashoffset="0" transform="rotate(-90)"/>
    <circle r="56" fill="none" stroke="#3b3b4a" stroke-width="20" stroke-dasharray="132 352" stroke-dashoffset="-220" transform="rotate(-90)"/>
    <text y="6" font-family="Bricolage Grotesque,sans-serif" font-size="26" font-weight="800" fill="#e8eaf0" text-anchor="middle">63%</text>
  </g>
  <g font-family="JetBrains Mono,monospace" font-size="11" fill="#9aa0ab">
    <rect x="520" y="300" width="10" height="10" rx="2" fill="#2dd4bf"/>
    <text x="538" y="310">Active loans</text>
    <rect x="520" y="322" width="10" height="10" rx="2" fill="#60a5fa"/>
    <text x="538" y="332">Reserves</text>
    <rect x="520" y="344" width="10" height="10" rx="2" fill="#3b3b4a"/>
    <text x="538" y="354">Other</text>
  </g>

  <!-- transactions -->
  <rect x="158" y="404" width="620" height="94" rx="12" fill="#141821"/>
  <text x="178" y="432" font-family="JetBrains Mono,monospace" font-size="11" fill="#6b7280">RECENT TRANSACTIONS</text>
  <g font-family="JetBrains Mono,monospace" font-size="12" fill="#9aa0ab">
    <rect x="178" y="446" width="8" height="8" rx="2" fill="#34d399"/>
    <text x="196" y="454">Wire · Acme Corp</text>
    <text x="430" y="454" fill="#34d399">+$48,200</text>
    <text x="620" y="454" fill="#6b7280">09:14</text>

    <rect x="178" y="468" width="8" height="8" rx="2" fill="#f87171"/>
    <text x="196" y="476">Settlement · Payroll</text>
    <text x="430" y="476" fill="#f87171">−$12,840</text>
    <text x="620" y="476" fill="#6b7280">08:02</text>
  </g>

  <!-- watermarks -->
  <text x="780" y="506" font-family="JetBrains Mono,monospace" font-size="9" fill="#3b3b4a" text-anchor="end">placeholder · enterprise banking platform</text>
</svg>
